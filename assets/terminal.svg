<text x="470.0" y="25" text-anchor="middle" class="ttl">claude code · applyjob</text>
<text x="34" y="70" class="l0"><tspan class="you">you ›</tspan><tspan class="out"> hi</tspan></text><text x="34" y="93" class="l1"><tspan class="ai">claude ›</tspan><tspan class="out"> No profile yet. Drop your master CV here and I&#x27;ll take it from there.</tspan></text><text x="34" y="116" class="l2 cmd"><tspan class="pr">$</tspan> applyjob read-cv cv.pdf</text><text x="34" y="139" class="l3 out">  657 characters -&gt; workspace/inbox/cv.txt</text><text x="34" y="162" class="l4 cmd"><tspan class="pr">$</tspan> applyjob profile questions --level core</text><text x="34" y="185" class="l5 out">  Needed to start:</text><text x="34" y="208" class="l6 out">  - Earliest start date</text><text x="34" y="231" class="l7 out">  - Salary expectation (gross per year + currency)</text><text x="34" y="254" class="l8 out">  - Work mode (onsite/hybrid/remote)            … 15 more</text><text x="34" y="277" class="l9 cmd"><tspan class="pr">$</tspan> applyjob search ba &quot;Data Analyst&quot; --where München</text><text x="34" y="300" class="l10 ok">  26 found, 26 new, 0 already known</text><text x="34" y="323" class="l11 cmd"><tspan class="pr">$</tspan> applyjob triage</text><text x="34" y="346" class="l12 ok">  GOOD 3 · CHECK 14 · REMOVED 8 · CLOSED 1</text><text x="34" y="369" class="l13 cmd"><tspan class="pr">$</tspan> applyjob audit 2026-10-26_munich-analyst</text><text x="34" y="392" class="l14 bad">  FAIL  A01 MAJOR cv.summary  summary 35-95 words | 34 words</text><text x="34" y="415" class="l15 ok">  PASS  after one fix · 0 blocker · 0 major</text><text x="34" y="438" class="l16 cmd"><tspan class="pr">$</tspan> applyjob queue 2026-10-26_munich-analyst</text><text x="34" y="461" class="l17 warn">  BLOCKED: &#x27;queue&#x27; needs these answers first: Nationality, Street, …</text><text x="34" y="484" class="l18 cmd"><tspan class="pr">$</tspan> applyjob approve-line 2026-10-26_munich-analyst</text><text x="34" y="507" class="l19 out">  submit 1 Nordwind Logistics, 4 Isarwerk Analytics</text><text x="34" y="530" class="l20 cmd"><tspan class="pr">$</tspan> applyjob record 1 SUBMITTED --evidence &quot;page: clicked submit&quot;</text><text x="34" y="553" class="l21 bad">  REFUSED: evidence must be a confirmation you saw, not an assumption</text>
