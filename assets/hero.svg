    <text x="273" y="294" class="lbl">search</text>
  </g>
  <g>
    <circle cx="437" cy="252" r="15" class="ring"/>
    <circle cx="437" cy="252" r="7" fill="#2b3a67"><animate attributeName="fill" dur="7.0s" repeatCount="indefinite" keyTimes="0;0.285;0.286;0.506;1" values="#2b3a67;#2b3a67;#34d399;#2b3a67;#2b3a67" calcMode="discrete"/></circle>
    <text x="437" y="294" class="lbl">triage</text>
  </g>
  <g>
    <circle cx="600" cy="252" r="15" class="ring"/>
    <circle cx="600" cy="252" r="7" fill="#2b3a67"><animate attributeName="fill" dur="7.0s" repeatCount="indefinite" keyTimes="0;0.428;0.429;0.649;1" values="#2b3a67;#2b3a67;#34d399;#2b3a67;#2b3a67" calcMode="discrete"/></circle>
    <text x="600" y="294" class="lbl">tailor</text>
  </g>
  <g>
    <circle cx="763" cy="252" r="15" class="ring"/>
    <circle cx="763" cy="252" r="7" fill="#2b3a67"><animate attributeName="fill" dur="7.0s" repeatCount="indefinite" keyTimes="0;0.570;0.571;0.791;1" values="#2b3a67;#2b3a67;#34d399;#2b3a67;#2b3a67" calcMode="discrete"/></circle>
    <text x="763" y="294" class="lbl">audit</text>
  </g>
  <g>
    <circle cx="927" cy="252" r="15" class="ring"/>
    <circle cx="927" cy="252" r="7" fill="#2b3a67"><animate attributeName="fill" dur="7.0s" repeatCount="indefinite" keyTimes="0;0.713;0.714;0.934;1" values="#2b3a67;#2b3a67;#34d399;#2b3a67;#2b3a67" calcMode="discrete"/></circle>
    <text x="927" y="294" class="lbl">apply</text>
  </g>
  <g>
    <circle cx="1090" cy="252" r="15" class="ring"/>
    <circle cx="1090" cy="252" r="7" fill="#2b3a67"><animate attributeName="fill" dur="7.0s" repeatCount="indefinite" keyTimes="0;0.856;0.857;0.999;1" values="#2b3a67;#2b3a67;#34d399;#2b3a67;#2b3a67" calcMode="discrete"/></circle>
    <text x="1090" y="294" class="lbl">proof</text>
  </g>
<circle r="14" fill="url(#glow)">
  <animateMotion dur="7.0s" repeatCount="indefinite" path="M110,252 L1090,252"/>
</circle>
</svg>