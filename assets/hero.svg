<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="applyjob: profile, search, triage, tailor, audit, apply, proof">
<style>
  .t { font: 800 76px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing:-2px }
  .s { font: 400 21px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill:#a9b4d0 }
  .k { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill:#7dd3fc; letter-spacing:2px }
  .lbl { font: 600 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill:#cbd5e1; text-anchor:middle }
  .ring { fill:#0f1730; stroke:#2b3a67; stroke-width:2 }
  .core { fill:#2b3a67; animation: lit 7.0s infinite }
  @keyframes lit { 0% { fill:#2b3a67 } 6% { fill:#34d399 } 30% { fill:#34d399 } 45% { fill:#2b3a67 } 100% { fill:#2b3a67 } }
  .flow { stroke:url(#g); stroke-width:3; stroke-dasharray:10 14; animation: run 1.2s linear infinite }
  @keyframes run { to { stroke-dashoffset:-24 } }
  .blink { animation: b 1.1s steps(1) infinite } @keyframes b { 50% { opacity:0 } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111a35"/></linearGradient>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1d2747"/></pattern>
  <radialGradient id="glow"><stop offset="0" stop-color="#22d3ee" stop-opacity=".9"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="340" rx="22" fill="url(#bg)"/>
<rect width="1200" height="340" rx="22" fill="url(#dots)"/>
<text x="110" y="74" class="k">AGENT HARNESS · CLAUDE CODE</text>
<text x="104" y="150" class="t" fill="url(#g)">applyjob</text>
<rect x="408" y="98" width="5" height="56" fill="#22d3ee"><animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/></rect>
<text x="110" y="192" class="s">Runs a whole job search with an AI agent, and refuses to make anything up.</text>
<line x1="110" y1="252" x2="1090" y2="252" stroke="#1d2747" stroke-width="3"/>
<line x1="110" y1="252" x2="1090" y2="252" class="flow"/>

  <g>
    <circle cx="110" cy="252" r="15" class="ring"/>
    <circle cx="110" cy="252" r="7" fill="#2b3a67"><animate attributeName="fill" dur="7.0s" repeatCount="indefinite" keyTimes="0;0.22;1" values="#34d399;#2b3a67;#2b3a67" calcMode="discrete"/></circle>
    <text x="110" y="294" class="lbl">profile</text>
  </g>
  <g>
    <circle cx="273" cy="252" r="15" class="ring"/>
